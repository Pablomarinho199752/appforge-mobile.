name: Gerar APK AppForge Mobile
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide Android command-line tools.
      # Avoid setup-android@v3, which currently attempts to install the removed "tools" package.
      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar arquivo de instalacao
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-Mobile-APK-teste
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
